<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmark Cloud Sync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="logo" aria-hidden="true">B</span>
      <div>
        <h1>Bookmark Cloud Sync</h1>
        <p class="sub" id="account-line">未连接 Google 账号</p>
      </div>
    </div>
    <button id="btn-open-options" class="icon-btn" title="设置">⚙</button>
  </header>

  <section class="status-card" id="status-card">
    <div class="status-row">
      <span class="dot" id="status-dot"></span>
      <strong id="status-text">正在读取状态…</strong>
    </div>
    <div class="status-grid">
      <div><span class="k">上次同步</span><span class="v" id="last-sync">—</span></div>
      <div><span class="k">云端版本</span><span class="v" id="revision">—</span></div>
      <div><span class="k">本地节点</span><span class="v" id="local-count">—</span></div>
      <div><span class="k">设备 ID</span><span class="v mono" id="device-id">—</span></div>
    </div>
  </section>

  <div id="alert" class="alert hidden" role="alert"></div>

  <section id="pending-box" class="pending hidden">
    <h2>⚠ 有删除操作等待确认</h2>
    <p id="pending-reason"></p>
    <ul id="pending-list"></ul>
    <div class="row">
      <button id="btn-apply-pending" class="primary">确认删除并同步</button>
      <button id="btn-cancel-pending" class="ghost">取消</button>
    </div>
  </section>

  <section id="conflict-box" class="conflicts hidden">
    <h2>最近的冲突处理</h2>
    <ul id="conflict-list"></ul>
  </section>

  <main class="actions">
    <button id="btn-sync" class="primary big">立即同步</button>
    <button id="btn-preview" class="ghost">预览差异</button>
    <button id="btn-snapshot" class="ghost">保存快照</button>
  </main>

  <div id="preview-box" class="preview hidden">
    <pre id="preview-text"></pre>
  </div>

  <footer class="foot">
    <span id="last-error" class="err"></span>
    <button id="btn-logs" class="link">查看日志</button>
  </footer>

  <div id="logs-box" class="logs hidden">
    <div class="logs-head">
      <strong>最近日志</strong>
      <button id="btn-clear-logs" class="link">清空</button>
    </div>
    <ol id="log-list"></ol>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
